version: '3.8'

services:
  web:
    networks:
      - common_network
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mongodb
      - localstack
    env_file:
      - .env
    volumes:
      - ./src:/app/src

  mongodb:
    image: bitnami/mongodb:7.0.5
    networks:
      - common_network
    volumes:
      - mongodb_data:/bitnami/mongodb
    ports:
      - "27017:27017"
    env_file:
      - .env


  localstack:
    image: localstack/localstack:3.1
    networks:
      - common_network
    ports:
      - "4566:4566"
    env_file:
      - .env
    environment:
      - DEBUG=1
      - SERVICES=ses
      - DEFAULT_REGION=${LOCALSTACK_REGION_NAME}
      - AWS_ACCESS_KEY_ID=${LOCALSTACK_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${LOCALSTACK_AWS_SECRET_ACCESS_KEY}
    volumes:
      - localstack_data:/var/lib/localstack

networks:
  common_network:
    external: true

volumes:
  mongodb_data:
  localstack_data:
