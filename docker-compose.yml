services:
  web:
    networks:
      - common_network
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env

  mongodb:
    # Archived image preserves the existing Bitnami replica-set configuration.
    image: bitnamilegacy/mongodb:7.0.5
    networks:
      - common_network
    volumes:
      - mongodb_data:/bitnami/mongodb
    ports:
      - "27017:27017"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  common_network:
    external: true

volumes:
  mongodb_data:
  localstack_data:
