version: '3.8'

services:
  web:
    networks:
      - common_network
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mongodb
    env_file:
      - .env

  mongodb:
    image: bitnami/mongodb:7.0.5
    networks:
      - common_network
    volumes:
      - mongodb_data:/bitnami/mongodb
    ports:
      - "27017:27017"
    env_file:
      - .env

networks:
  common_network:
    external: true

volumes:
  mongodb_data:
  localstack_data:
