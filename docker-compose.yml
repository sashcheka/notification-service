version: '3.8'

services:
  notification-service:
    build:
      context: .
      dockerfile: src/Dockerfile
    command: sh -c "python src/main.py"
    ports:
      - "8000:8000"
    volumes:
      - .:/src
    depends_on:
      - rabbitmq
      - mongodb
    env_file:
      - .env

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo

volumes:
  rabbitmq_data:
