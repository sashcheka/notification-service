version: '3.8'

services:
  web-test:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mongodb-test
      - localstack-test
      - rabbitmq-test
    env_file:
      - test.env
    volumes:
      - ./src:/app/src

  mongodb-test:
    image: bitnami/mongodb:7.0.5
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data_test:/bitnami/mongodb
    env_file:
      - test.env

  rabbitmq-test:
    image: rabbitmq:3.12.13-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data_test:/var/lib/rabbitmq
    env_file:
      - test.env

  localstack-test:
    image: localstack/localstack:3.1
    ports:
      - "4567:4566"
    env_file:
      - test.env
    environment:
      - DEBUG=1
      - SERVICES=ses
      - DEFAULT_REGION=${LOCALSTACK_REGION_NAME}
      - AWS_ACCESS_KEY_ID=${LOCALSTACK_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${LOCALSTACK_AWS_SECRET_ACCESS_KEY}
    volumes:
      - localstack_data_test:/var/lib/localstack

volumes:
  mongodb_data_test:
  localstack_data_test:
  rabbitmq_data_test:
